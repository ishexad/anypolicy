<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AnyPolicy — Policy drafting & review, by jurisdiction</title>
<meta name="description" content="Draft or review HR, safeguarding, and data protection policies matched to the laws of the jurisdiction you operate in." />
</head>
<body>
<style>
  :root{
    --ink:#1C3829;
    --parchment:#F6F1E7;
    --paper:#FFFFFF;
    --brass:#7A2E2E;
    --brass-light:#B97575;
    --slate:#5C6B62;
    --sage:#8C7A3D;
    --rule:#DDD6C5;
    --banner-bg:#F6EFDC;
    --selected-bg:#F7EEEE;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--parchment);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance;}
  button,input,textarea,select{font-family:inherit;}
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:2px;
  }
  a{color:inherit;}
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }

  /* -------- layout helpers -------- */
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;}
  .wrap-narrow{max-width:440px;margin:0 auto;padding:0 24px;}
  .wrap-mode{max-width:900px;margin:0 auto;padding:0 24px;}
  .wrap-wizard{max-width:960px;margin:0 auto;padding:0 24px;}
  .wrap-pricing{max-width:1100px;margin:0 auto;padding:0 24px;}

  .grid-hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:48px;align-items:center;}
  .grid-cols-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .grid-cols-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch;}
  .grid-mode{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .grid-wizard{display:grid;grid-template-columns:180px 1fr;gap:40px;}
  .grid-country{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:360px;overflow-y:auto;padding-right:4px;}

  @media (max-width:900px){
    .grid-cols-4{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:640px){
    .grid-hero{grid-template-columns:1fr;}
    .grid-hero > div:last-child{margin-top:32px;}
    .grid-cols-2{grid-template-columns:1fr;}
    .grid-cols-3{grid-template-columns:1fr;}
    .grid-cols-4{grid-template-columns:1fr;}
    .grid-mode{grid-template-columns:1fr;}
    .grid-wizard{grid-template-columns:1fr;}
    .grid-country{grid-template-columns:1fr;}
  }

  /* -------- header / footer -------- */
  .site-header{
    border-bottom:2px solid var(--ink);
    background:var(--paper);
    position:sticky;top:0;z-index:10;
  }
  .site-header-inner{
    max-width:1040px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
  }
  .brand-btn{display:flex;align-items:baseline;gap:10px;background:none;border:none;cursor:pointer;padding:0;}
  .brand-name{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:0.01em;color:var(--ink);}
  .header-actions{display:flex;align-items:center;gap:18px;}
  .link-btn{background:none;border:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--slate);padding:0;}
  .user-chip{
    display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;
    border:1px solid var(--rule);border-radius:20px;background:var(--paper);cursor:pointer;
  }
  .user-avatar{
    width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);
    font-family:var(--font-mono);font-size:10px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  .site-footer{
    border-top:1px solid var(--rule);margin-top:40px;padding:24px;
    text-align:center;font-size:11px;color:var(--slate);
  }

  /* -------- buttons -------- */
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:5px;cursor:pointer;font-family:var(--font-body);}
  .btn-primary{padding:9px 16px;font-size:13px;font-weight:600;background:var(--ink);color:var(--paper);}
  .btn-primary.lg{padding:12px 22px;font-size:14px;}
  .btn-ghost{padding:9px 14px;font-size:13px;font-weight:500;background:transparent;color:var(--ink);border:1px solid var(--rule);}
  .btn-ghost.sm{padding:7px 12px;font-size:12px;}
  .btn-nav{padding:10px 18px;font-size:13px;font-weight:500;background:transparent;color:var(--ink);}
  .btn-nav.primary{background:var(--ink);color:var(--paper);}
  .btn-nav.final{background:var(--brass);color:var(--paper);opacity:0.6;cursor:not-allowed;}
  .btn-nav[disabled]{background:var(--rule);color:var(--paper);cursor:not-allowed;}
  .btn[disabled]{cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  /* -------- generic cards / sections -------- */
  .section{max-width:1040px;margin:0 auto;padding:40px 24px;}
  .card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:24px;}
  .icon-circle{
    width:40px;height:40px;border-radius:50%;background:var(--parchment);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--brass);margin-bottom:6px;text-transform:uppercase;}
  .h-title{font-family:var(--font-display);font-weight:700;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--slate);margin:0;}

  /* -------- chip / picker -------- */
  .chip{
    padding:10px 12px;font-size:13px;border:1.5px solid var(--rule);border-radius:5px;
    cursor:pointer;background:var(--paper);color:var(--ink);text-align:left;transition:border-color .15s;
  }
  .chip.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .chip-country{display:flex;align-items:center;gap:10px;}
  .chip-country .region{font-size:11px;color:var(--slate);}
  .chip-country.selected .region{color:var(--brass-light);}

  .instrument-row{
    display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;
    padding:16px 18px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;
  }
  .instrument-row.selected{border-color:var(--ink);background:var(--selected-bg);}
  .instrument-icon{
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:var(--parchment);color:var(--ink);
  }
  .instrument-row.selected .instrument-icon{background:var(--ink);color:var(--paper);}
  .instrument-check{
    width:20px;height:20px;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;margin-top:2px;background:transparent;
  }
  .instrument-check.round{border-radius:50%;}
  .instrument-check.square{border-radius:4px;}
  .instrument-row.selected .instrument-check{border-color:var(--ink);background:var(--ink);}

  input[type=text],input[type=email],textarea{
    width:100%;padding:10px 12px;font-size:14px;font-family:var(--font-body);
    border:1.5px solid var(--rule);border-radius:5px;background:var(--paper);color:var(--ink);
  }
  textarea{min-height:220px;resize:vertical;line-height:1.6;}
  .field{margin-bottom:18px;}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--slate);margin-bottom:6px;}
  .input-icon-wrap{position:relative;}
  .input-icon-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--slate);}
  .input-icon-wrap input{padding-left:36px;}

  .banner{
    border:1px dashed var(--brass);border-radius:6px;padding:16px 18px;background:var(--banner-bg);
    font-size:13px;color:var(--ink);margin-bottom:20px;line-height:1.5;
  }
  .banner.sm{padding:12px 14px;font-size:11.5px;}
  .disclaimer{font-size:12px;color:var(--slate);line-height:1.6;}

  .review-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--rule);}
  .review-row:last-child{border-bottom:none;}
  .review-row svg{color:var(--brass);margin-top:2px;flex-shrink:0;}
  .review-row .rlabel{font-size:11px;color:var(--slate);margin-bottom:2px;}
  .review-row .rvalue{font-size:14px;font-weight:500;}
  .review-table{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:20px;}

  /* -------- wizard step nav -------- */
  .step-nav-list{list-style:none;margin:0;padding:0;position:relative;}
  .step-rail{position:absolute;left:11px;top:12px;bottom:12px;width:1px;background:var(--rule);}
  .step-item{display:flex;align-items:center;gap:12px;margin-bottom:28px;position:relative;}
  .step-item.clickable{cursor:pointer;}
  .step-badge{
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);font-size:11px;flex-shrink:0;background:var(--paper);
    border:1.5px solid var(--rule);color:var(--ink);position:relative;z-index:1;
  }
  .step-badge.active{border-color:var(--ink);}
  .step-badge.done{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .step-label{font-size:13px;font-weight:500;color:var(--slate);}
  .step-label.active{font-weight:600;color:var(--ink);}

  .docref-bar{border-bottom:1px solid var(--rule);background:var(--paper);}
  .docref-inner{max-width:960px;margin:0 auto;padding:10px 24px;font-family:var(--font-mono);font-size:12px;color:var(--brass);text-align:right;}

  /* -------- comparison section -------- */
  .compare-card{border-radius:8px;padding:24px;}
  .compare-card.generic{background:var(--parchment);border:1.5px solid var(--rule);}
  .compare-card.feature{background:var(--paper);border:2px solid var(--brass);position:relative;box-shadow:0 20px 40px -28px rgba(28,56,41,0.35);}
  .compare-badge{position:absolute;top:-12px;right:20px;background:var(--brass);color:var(--paper);font-size:10.5px;font-weight:700;letter-spacing:0.06em;padding:4px 10px;border-radius:20px;}
  .compare-title{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .compare-row{display:flex;gap:10px;align-items:flex-start;}
  .compare-list{display:grid;gap:14px;}

  /* -------- pricing -------- */
  .tier-card{position:relative;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:22px;display:flex;flex-direction:column;}
  .tier-card.highlighted{border:2px solid var(--brass);box-shadow:0 20px 40px -28px rgba(28,56,41,0.35);}
  .tier-badge{position:absolute;top:-12px;left:20px;background:var(--brass);color:var(--paper);font-size:10px;font-weight:700;letter-spacing:0.06em;padding:4px 10px;border-radius:20px;}
  .tier-name{font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:4px;}
  .tier-tagline{font-size:12px;color:var(--slate);margin-bottom:16px;min-height:32px;}
  .tier-price{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--ink);}
  .tier-period{font-size:13px;color:var(--slate);}
  .tier-features{display:grid;gap:10px;margin:18px 0 22px;flex:1;}
  .tier-feature{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;}
  .tier-feature svg{color:var(--sage);margin-top:2px;flex-shrink:0;}

  /* -------- country pills (landing) -------- */
  .pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--rule);border-radius:20px;background:var(--paper);font-size:13px;}
  .pill-more{display:flex;align-items:center;padding:8px 14px;border-radius:20px;font-size:13px;color:var(--brass);font-weight:600;}

  /* -------- misc -------- */
  .cta-band{border:1.5px solid var(--ink);border-radius:8px;padding:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;background:var(--paper);}
  .mode-card{
    text-align:left;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:26px;
    cursor:pointer;display:flex;flex-direction:column;gap:14px;width:100%;
  }
  .mode-card .icon-circle{width:44px;height:44px;margin-bottom:0;}
  .mode-card-title{font-family:var(--font-display);font-size:19px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .mode-card-desc{font-size:13px;color:var(--slate);line-height:1.55;}
  .mode-card-cta{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brass);margin-top:auto;}

  .hero-mock{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:22px;box-shadow:0 24px 48px -24px rgba(28,56,41,0.25);}
  .path-card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:24px;}
</style>

<div id="app"></div>

<script>

    {id:"starter",name:"Starter",price:"$29",period:"/month",tagline:"For a single HR or compliance lead.",cta:"Choose Starter",highlighted:false,

  var COMPARISON_ROWS = [

    {generic:"Output format changes every time you ask",anypolicy:"Same structured dossier format, every time"},
    {generic:"Jurisdiction is whatever you remembered to type",anypolicy:"Jurisdiction is locked in from step one"},
    {generic:"No dedicated way to check a policy you already have",anypolicy:"A separate flow built just for reviewing existing policies"},
    {generic:"Legal-review reminder — maybe, maybe not",anypolicy:"Legal-review reminder shown on every screen"}
  ];

  var PERSONAL_EMAIL_DOMAINS = ["gmail.com","yahoo.com","outlook.com","hotmail.com","icloud.com","aol.com","live.com","protonmail.com","mail.com"];

  /* ============================= helpers ============================= */
  function escapeHtml(str){
    return String(str == null ? "" : str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function flagEmoji(iso2){
    return iso2.toUpperCase().replace(/./g, function(ch){
      return String.fromCodePoint(127397 + ch.charCodeAt(0));
    });
  }

  function todayRef(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function parseWorkEmail(email){
    var trimmed = (email || "").trim().toLowerCase();
    var match = trimmed.match(/^[^\s@]+@([^\s@]+\.[^\s@]+)$/);
    if(!match) return {valid:false,error:"Enter a full email address."};
    var domain = match[1];
    if(PERSONAL_EMAIL_DOMAINS.indexOf(domain) !== -1){
      return {valid:false,error:"Please use your work email address — personal domains like gmail.com aren't supported."};
    }
    var local = trimmed.split("@")[0];
    var initials = local.slice(0,2).toUpperCase();
    var orgName = domain.split(".")[0];
    var org = orgName.charAt(0).toUpperCase() + orgName.slice(1);
    return {valid:true,email:trimmed,domain:domain,initials:initials,org:org};
  }

  function findCountry(iso2){
    for(var i=0;i<COUNTRIES.length;i++) if(COUNTRIES[i].iso2 === iso2) return COUNTRIES[i];

  }
  function findPolicy(id){
    for(var i=0;i<POLICY_TYPES.length;i++) if(POLICY_TYPES[i].id === id) return POLICY_TYPES[i];

  }

    check:'<polyline points="20 6 9 17 4 12"/>',
    arrowRight:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
    arrowLeft:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',

  function icon(name, size, extra){
    size = size || 16;
    extra = extra || "";
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" style="display:block;flex-shrink:0;'+extra+'">' + (ICON_PATHS[name]||"") + '</svg>';

  /* ============================= state ============================= */
  var state = {
    view: "landing",
    user: null,
    pendingView: "mode",
    login: {email:"", error:""},
    draft: {step:1, orgName:"", sector:"", country:null, countryQuery:"", selectedPolicies:[]},
    review: {step:1, country:null, countryQuery:"", instrument:null, docText:"", fileName:""}
  };

  function freshDraft(){ return {step:1, orgName:"", sector:"", country:null, countryQuery:"", selectedPolicies:[]}; }
  function freshReview(){ return {step:1, country:null, countryQuery:"", instrument:null, docText:"", fileName:""}; }

  /* ============================= navigation ============================= */
  function setView(v){
    if(v === "draft") state.draft = freshDraft();
    if(v === "review") state.review = freshReview();
    state.view = v;
    window.scrollTo(0,0);
    render();
  }
  function goProtected(target){
    if(state.user){ setView(target); }
    else { state.pendingView = target; setView("login"); }
  }
  function handleSignOut(){
    state.user = null;
    setView("landing");
  }

  /* ============================= root render ============================= */
  function render(){
    var app = document.getElementById("app");
    var body = "";
    if(state.view === "landing") body = renderLanding();
    else if(state.view === "pricing") body = renderPricing();
    else if(state.view === "login") body = renderLogin();
    else if(state.view === "mode") body = renderModeSelect();
    else if(state.view === "draft") body = renderDraftWizard();
    else if(state.view === "review") body = renderReviewWizard();

    app.innerHTML = renderHeader() + body + renderFooter();

    if(state.view === "login"){
      var emailInput = document.getElementById("emailInput");
      if(emailInput) emailInput.value = state.login.email;
    }
    if(state.view === "draft"){
      var orgInput = document.getElementById("orgNameInput");
      if(orgInput) orgInput.value = state.draft.orgName;
    }
    if(state.view === "review" && state.review.step === 3){
      var ta = document.getElementById("docTextArea");
      if(ta) ta.value = state.review.docText;
    }
  }

  /* ============================= header / footer ============================= */
  function renderHeader(){
    var actions = "";
    if(state.view === "landing" || state.view === "pricing"){
      actions += '<button class="link-btn" onclick="App.setView(\'pricing\')">Pricing</button>';
    }
    if(state.view !== "landing" && state.view !== "pricing" && state.view !== "login"){
      actions += '<button class="btn-nav" style="padding:0;gap:6px;" onclick="App.setView(\'landing\')">'+icon("arrowLeft",14)+' Back to home</button>';
    }
    if(state.view !== "login"){
      if(state.user){
        actions += '<button class="user-chip" title="Sign out" onclick="App.handleSignOut()">' +
          '<span class="user-avatar">'+escapeHtml(state.user.initials)+'</span>' +
          '<span style="font-size:12px;color:var(--ink);font-weight:500;">'+escapeHtml(state.user.org)+'</span>' +
          icon("logOut",13,"color:var(--slate);") + '</button>';
      } else {
        actions += '<button class="btn btn-primary" onclick="App.goProtected(\'mode\')">Sign in '+icon("arrowRight",14)+'</button>';
      }
    }
    return '<header class="site-header"><div class="site-header-inner">' +
      '<button class="brand-btn" onclick="App.setView(\'landing\')">'+icon("scrollText",20,"color:var(--brass);")+'<span class="brand-name">AnyPolicy</span></button>' +
      '<div class="header-actions">'+actions+'</div>' +
      '</div></header>';
  }

  function renderFooter(){
    return '<footer class="site-footer">AnyPolicy is a drafting and review aid, not a substitute for legal advice. © ' +

  App.onEmailInput = function(val){
    state.login.email = val;
    if(state.login.error){

      if(input) input.style.borderColor = "var(--rule)";

  App.handleLoginContinue = function(){
    var result = parseWorkEmail(state.login.email);
    if(!result.valid){
      state.login.error = result.error;
      render();
      return;

    state.login.error = "";
    state.user = {email:result.email, domain:result.domain, initials:result.initials, org:result.org};

  /* ============================= wizard shell ============================= */
  function wizardShell(steps, step, docRef, contentHtml, idPrefix){
    var items = steps.map(function(s){
      var active = s.id === step, done = s.id < step;
      var badgeCls = "step-badge" + (active?" active":"") + (done?" done":"");
      var clickable = done ? " clickable" : "";
      var onclick = done ? ' onclick="App.jumpStep(\''+idPrefix+'\','+s.id+')"' : "";
      return '<li class="step-item'+clickable+'"'+onclick+'>' +
        '<div class="'+badgeCls+'">'+(done ? icon("check",13) : String(s.id).padStart(2,"0"))+'</div>' +
        '<span class="step-label'+(active?" active":"")+'">'+escapeHtml(s.label)+'</span>' +
      '</li>';
    }).join("");

    return '<div class="docref-bar"><div class="docref-inner">'+escapeHtml(docRef)+'</div></div>' +
      '<div class="wrap-wizard" style="padding:36px 24px 24px;">' +
        '<div class="grid-wizard">' +
          '<nav aria-label="Progress"><ol class="step-nav-list"><div class="step-rail"></div>'+items+'</ol></nav>' +
          '<main>'+contentHtml+'</main>' +
        '</div>' +
      '</div>';
  }

  function stepCard(eyebrow, title, subtitle, inner){
    return '<div class="card" style="padding:28px 28px 24px;">' +
      '<div class="eyebrow">'+escapeHtml(eyebrow)+'</div>' +
      '<h1 class="h-title" style="font-size:24px;font-weight:600;">'+escapeHtml(title)+'</h1>' +
      '<p class="sub" style="margin-bottom:22px;">'+escapeHtml(subtitle)+'</p>' +
      inner +
    '</div>';
  }

  function wizardNav(step, totalSteps, canAdvance, backAction, nextAction, finalLabel, finalTitle){
    var nextBtn;
    if(step < totalSteps){
      nextBtn = '<button class="btn btn-nav'+(canAdvance?" primary":"")+'" '+(canAdvance?"":"disabled")+' onclick="'+nextAction+'">Continue '+icon("arrowRight",15)+'</button>';
    } else {
      nextBtn = '<button class="btn btn-nav final" disabled title="'+escapeHtml(finalTitle)+'">'+escapeHtml(finalLabel)+' '+icon("arrowRight",15)+'</button>';
    }
    return '<div style="display:flex;justify-content:space-between;margin-top:28px;">' +
      '<button class="btn btn-nav" onclick="'+backAction+'">'+icon("arrowLeft",15)+' Back</button>' +
      nextBtn +
    '</div>';
  }

  function countryPickerHtml(idPrefix, query, selected){
    return '<div>' +
      '<div class="input-icon-wrap" style="margin-bottom:16px;">'+icon("search",16) +
      '<input type="text" placeholder="Search country or region" value="'+escapeHtml(query)+'" ' +
        'oninput="App.onCountryQuery(\''+idPrefix+'\', this.value)"/></div>' +
      '<div class="grid-country" id="'+idPrefix+'CountryGrid">'+countryGridItems(idPrefix, query, selected)+'</div>' +
    '</div>';
  }

  function countryGridItems(idPrefix, query, selected){
    var q = (query||"").trim().toLowerCase();
    var list = COUNTRIES.filter(function(c){
      return !q || c.name.toLowerCase().indexOf(q) !== -1 || c.region.toLowerCase().indexOf(q) !== -1;
    });
    if(list.length === 0){
      return '<div style="color:var(--slate);font-size:13px;padding:8px 2px;">No jurisdictions match "'+escapeHtml(query)+'".</div>';
    }
    return list.map(function(c){
      var sel = selected && selected.iso2 === c.iso2;
      return '<button class="chip chip-country'+(sel?" selected":"")+'" onclick="App.selectCountry(\''+idPrefix+'\',\''+c.iso2+'\')">' +
        '<span style="font-size:18px;">'+flagEmoji(c.iso2)+'</span>' +
        '<span><div style="font-size:13px;font-weight:500;">'+escapeHtml(c.name)+'</div><div class="region">'+escapeHtml(c.region)+'</div></span>' +
      '</button>';
    }).join("");
  }

  function instrumentPickerHtml(idPrefix, mode, selected){
    return '<div style="display:grid;gap:12px;">' +
      POLICY_TYPES.map(function(p){
        var sel = mode === "multi" ? selected.indexOf(p.id) !== -1 : selected === p.id;
        var shape = mode === "multi" ? "square" : "round";
        var handler = mode === "multi" ? "App.togglePolicy('"+p.id+"')" : "App.selectInstrument('"+p.id+"')";
        return '<button class="instrument-row'+(sel?" selected":"")+'" onclick="'+handler+'">' +
          '<div class="instrument-icon">'+icon(p.icon,17)+'</div>' +
          '<div style="flex:1;"><div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<span style="font-family:var(--font-display);font-size:17px;font-weight:600;">'+escapeHtml(p.title)+'</span>' +
            '<span style="font-family:var(--font-mono);font-size:11px;color:var(--brass);">'+p.code+'</span></div>' +
            '<p style="font-size:13px;color:var(--slate);margin:4px 0 0;">'+escapeHtml(p.description)+'</p></div>' +
          '<div class="instrument-check '+shape+'">'+(sel?icon("check",13,"color:var(--paper);"):"")+'</div>' +
        '</button>';
      }).join("") +
    '</div>';
  }

  function reviewRow(iconName, label, value){
    return '<div class="review-row">'+icon(iconName,16)+
      '<div><div class="rlabel">'+escapeHtml(label)+'</div><div class="rvalue">'+value+'</div></div></div>';
  }

  /* ============================= draft wizard ============================= */
  function draftDocRef(){
    var d = state.draft;
    var parts = ["AP"];
    parts.push(d.country ? d.country.iso2 : "--");
    parts.push(d.selectedPolicies.length ? d.selectedPolicies.map(function(id){return findPolicy(id).code;}).join("+") : "----");
    parts.push(todayRef());
    return parts.join(" / ");
  }
  function draftCanAdvance(){
    var d = state.draft;
    return {1: d.orgName.trim().length>0 && d.sector.length>0, 2: !!d.country, 3: d.selectedPolicies.length>0, 4:true}[d.step];
  }

  function renderDraftWizard(){
    var d = state.draft;
    var content = "";
    if(d.step === 1){
      var sectorChips = SECTORS.map(function(s){
        return '<button class="chip'+(d.sector===s?" selected":"")+'" onclick="App.setSector(\''+s.replace(/'/g,"\\'")+'\')">'+escapeHtml(s)+'</button>';
      }).join("");
      content = stepCard("Step 01","Tell us about the organization","This appears on the cover page of every instrument drafted.",
        '<div class="field"><label>Organization name</label>' +
          '<input id="orgNameInput" type="text" placeholder="e.g. Meridian Health Trust" oninput="App.onOrgNameInput(this.value)"/></div>' +
        '<div class="field"><label>Sector</label><div class="grid-cols-2">'+sectorChips+'</div></div>'
      );
    } else if(d.step === 2){
      content = stepCard("Step 02","Select the governing jurisdiction","Policies are drafted to reflect the laws of this country.",
        countryPickerHtml("draft", d.countryQuery, d.country));
    } else if(d.step === 3){
      content = stepCard("Step 03","Choose the instruments to draft","Select one or more. Each is drafted as a separate document.",
        instrumentPickerHtml("draft","multi", d.selectedPolicies));
    } else {
      var table = '<div class="review-table">' +
        reviewRow("building2","Organization", escapeHtml(d.orgName || "—")) +
        reviewRow("clipboardList","Sector", escapeHtml(d.sector || "—")) +
        reviewRow("globe2","Jurisdiction", d.country ? flagEmoji(d.country.iso2)+"  "+escapeHtml(d.country.name)+" · "+escapeHtml(d.country.region) : "—") +
        reviewRow("fileText","Instruments", d.selectedPolicies.length ? escapeHtml(d.selectedPolicies.map(function(id){return findPolicy(id).title;}).join(", ")) : "—") +
      '</div>';
      content = stepCard("Step 04","Review the dossier","Confirm the details below before drafting begins.",
        table +
        '<div class="banner"><strong style="font-family:var(--font-display);font-weight:600;">Drafting engine — coming next.</strong> This screen confirms the dossier is ready. Generating the actual clause language for '+(d.country?escapeHtml(d.country.name):"the selected jurisdiction")+' is the next phase of this build.</div>' +
        '<p class="disclaimer">Nothing produced by this tool constitutes legal advice. Results should be reviewed by qualified local counsel before adoption.</p>');
    }

    var nav = wizardNav(d.step, 4, draftCanAdvance(), "App.draftBack()", "App.draftNext()", "Compile draft", "Drafting engine not yet built");
    return wizardShell(DRAFT_STEPS, d.step, draftDocRef(), content + nav, "draft");
  }

  App.onOrgNameInput = function(val){
    state.draft.orgName = val;
    updateNavButton(draftCanAdvance());
  };
  App.setSector = function(s){ state.draft.sector = s; render(); };
  App.draftBack = function(){
    if(state.draft.step === 1) setView("mode");
    else { state.draft.step -= 1; render(); }
  };
  App.draftNext = function(){
    if(!draftCanAdvance()) return;
    state.draft.step += 1; render();
  };

  /* ============================= review wizard ============================= */
  function reviewDocRef(){
    var r = state.review;
    var parts = ["AP-REV"];
    parts.push(r.country ? r.country.iso2 : "--");
    parts.push(r.instrument ? findPolicy(r.instrument).code : "--");
    parts.push(todayRef());
    return parts.join(" / ");
  }
  function reviewCanAdvance(){
    var r = state.review;
    return {1: !!r.country, 2: !!r.instrument, 3: r.docText.trim().length>0, 4:true}[r.step];
  }
  function wordCount(text){
    var t = (text||"").trim();
    return t ? t.split(/\s+/).length : 0;
  }

  function renderReviewWizard(){
    var r = state.review;
    var content = "";
    if(r.step === 1){
      content = stepCard("Step 01","Select the governing jurisdiction","Your document will be checked against the laws of this country.",
        countryPickerHtml("review", r.countryQuery, r.country));
    } else if(r.step === 2){
      content = stepCard("Step 02","What kind of policy is this?","Choose the instrument that best matches your document.",
        instrumentPickerHtml("review","single", r.instrument));
    } else if(r.step === 3){
      var wc = wordCount(r.docText);
      content = stepCard("Step 03","Add your document","Paste the text, or upload a plain text file.",
        '<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px;">' +
          '<button class="btn btn-ghost sm" onclick="document.getElementById(\'fileInput\').click()">'+icon("uploadCloud",14)+' Upload file</button>' +
          '<input id="fileInput" type="file" accept=".txt,.md" style="display:none;" onchange="App.onFileChosen(this)"/>' +
        '</div>' +
        '<textarea id="docTextArea" placeholder="Paste the full text of your existing policy here…" oninput="App.onDocTextInput(this.value)"></textarea>' +
        '<div style="display:flex;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:6px;">' +
          '<span id="wordCountLabel" style="font-size:11px;color:var(--slate);">'+(r.fileName?"Loaded from "+escapeHtml(r.fileName)+" · ":"")+wc+" word"+(wc===1?"":"s")+'</span>' +
          '<span style="font-size:11px;color:var(--slate);display:flex;align-items:center;gap:4px;">'+icon("alertCircle",12)+' Currently accepts .txt / .md — PDF and Word support coming soon</span>' +
        '</div>');
    } else {
      var wc4 = wordCount(r.docText);
      var table = '<div class="review-table">' +
        reviewRow("globe2","Jurisdiction", r.country ? flagEmoji(r.country.iso2)+"  "+escapeHtml(r.country.name)+" · "+escapeHtml(r.country.region) : "—") +
        reviewRow("fileText","Instrument", r.instrument ? escapeHtml(findPolicy(r.instrument).title) : "—") +
        reviewRow("clipboardList","Document", wc4+" word"+(wc4===1?"":"s")+(r.fileName?" · "+escapeHtml(r.fileName):" · pasted text")) +
      '</div>';
      content = stepCard("Step 04","Review the submission","Confirm the details below before the check begins.",
        table +
        '<div class="banner"><strong style="font-family:var(--font-display);font-weight:600;">Compliance check — coming next.</strong> This screen confirms your document is ready. Comparing its clauses against '+(r.country?escapeHtml(r.country.name):"the selected jurisdiction")+'\'s requirements and flagging gaps is the next phase of this build.</div>' +
        '<p class="disclaimer">Nothing produced by this tool constitutes legal advice. Results should be reviewed by qualified local counsel before adoption.</p>');
    }

    var nav = wizardNav(r.step, 4, reviewCanAdvance(), "App.reviewBack()", "App.reviewNext()", "Run review", "Review engine not yet built");
    return wizardShell(REVIEW_STEPS, r.step, reviewDocRef(), content + nav, "review");
  }

  App.onDocTextInput = function(val){
    state.review.docText = val;
    state.review.fileName = "";
    var wc = wordCount(val);
    var label = document.getElementById("wordCountLabel");
    if(label) label.textContent = wc + " word" + (wc===1?"":"s");
    updateNavButton(reviewCanAdvance());
  };
  App.onFileChosen = function(input){
    var file = input.files && input.files[0];
    if(!file) return;
    state.review.fileName = file.name;
    var reader = new FileReader();
    reader.onload = function(ev){
      state.review.docText = String(ev.target.result || "");
      render();
    };
    reader.readAsText(file);
  };
  App.reviewBack = function(){
    if(state.review.step === 1) setView("mode");
    else { state.review.step -= 1; render(); }
  };
  App.reviewNext = function(){
    if(!reviewCanAdvance()) return;
    state.review.step += 1; render();
  };

  /* ============================= shared wizard interactions ============================= */
  App.onCountryQuery = function(idPrefix, val){
    var target = idPrefix === "draft" ? state.draft : state.review;
    target.countryQuery = val;
    var grid = document.getElementById(idPrefix+"CountryGrid");
    if(grid) grid.innerHTML = countryGridItems(idPrefix, val, target.country);
  };
  App.selectCountry = function(idPrefix, iso2){
    var target = idPrefix === "draft" ? state.draft : state.review;
    target.country = findCountry(iso2);
    render();
  };
  App.togglePolicy = function(id){
    var list = state.draft.selectedPolicies;
    var i = list.indexOf(id);
    if(i === -1) list.push(id); else list.splice(i,1);
    render();
  };
  App.selectInstrument = function(id){
    state.review.instrument = id;
    render();
  };
  App.jumpStep = function(idPrefix, stepId){
    var target = idPrefix === "draft" ? state.draft : state.review;
    if(stepId < target.step){ target.step = stepId; render(); }
  };

  function updateNavButton(canAdvance){
    var buttons = document.querySelectorAll("main .btn-nav");
    var nextBtn = buttons[buttons.length-1];
    if(!nextBtn || nextBtn.classList.contains("final")) return;
    nextBtn.disabled = !canAdvance;
    nextBtn.classList.toggle("primary", canAdvance);
  }

  /* ============================= expose + init ============================= */
  App.setView = setView;
  App.goProtected = goProtected;
  App.handleSignOut = handleSignOut;

  render();
})();
</script>
</body>
</html>
